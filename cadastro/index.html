<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominus Auto - Cadastro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <svg width="36" height="36" viewBox="0 0 100 100">
        <rect x="10" y="10" width="38" height="38" rx="8" fill="#b69f54"/>
        <circle cx="71" cy="29" r="19" fill="#f0ebd8"/>
        <circle cx="29" cy="71" r="19" fill="#4196a4"/>
        <rect x="52" y="52" width="38" height="38" rx="8" fill="#c9b067"/>
      </svg>
      <span class="logo-text">DOMINUS <br><small>AUTO</small></span>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="veiculos.html">Veículos</a>
      <a href="suporte.html">Suporte</a>
      <a href="sobre.html">Sobre Nós</a>
      <a href="planos.html">Planos</a>
    </nav>

    <div class="header-actions">
      <a href="login.html" class="btn-login-nav">Fazer Login</a>
      <div class="user-menu-wrapper">
        <div class="user-avatar-placeholder">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="dropdown-menu-floating">
          <a href="conta.html" class="dropdown-item">Informações de conta</a>
          <a href="seguranca.html" class="dropdown-item">Dados e segurança</a>
          <a href="login.html" class="dropdown-item">Sair</a>
        </div>
      </div>
    </div>
  </header>

  <section class="login-screen">
    <div class="login-form-area">
      <h1 class="brand-header-title">DOMINUS AUTO</h1>
      <h2 class="login-welcome">Crie sua Conta</h2>
      
      <form action="conta.html">
        <label class="field-label">Nome Completo</label>
        <input type="text" class="input-rounded" placeholder="Digite seu nome completo" required>

        <label class="field-label">Email</label>
        <input type="email" class="input-rounded" placeholder="Digite seu melhor email" required>
        
        <label class="field-label">CPF ou CNH</label>
        <input type="text" class="input-rounded" placeholder="Apenas números" required>
        
        <label class="field-label">Senha</label>
        <input type="password" class="input-rounded" placeholder="Crie uma senha forte" required>

        <label class="field-label">Confirmar Senha</label>
        <input type="password" class="input-rounded" placeholder="Repita a senha" required>
        
        <button type="submit" class="btn-login-submit" style="margin-top: 10px;">Cadastrar</button>
      </form>
      
      <div style="margin-top: 30px;">
        Já tem uma conta? <a href="login.html" style="font-weight:700; color:#1a1a1a; text-decoration: none;">Faça Login</a>
      </div>
    </div>
    
    <div class="login-bg-area"></div>
  </section>

</body>
</html>
